definitions:
  actualiteco_actualite_internal_core_domain.CustomError:
    properties:
      code:
        type: string
      message:
        example: invalid request
        type: string
    type: object
  actualiteco_actualite_internal_core_domain.InternalError:
    properties:
      code:
        enum:
        - INTERNAL_ERROR
        type: string
      message:
        type: string
    type: object
  internal_features_auth_transport_http.LoginDTO:
    properties:
      email:
        example: test.user@email.com
        type: string
      password:
        example: hashpassword
        maxLength: 64
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  internal_features_auth_transport_http.LoginDTOResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3OTM2NjUxNzcsImlhdCI6MTc5MzYyMTk3NywiVXNlcklkIjoiODc5NGU1ODktMGRkYi00M2NlLTlmOTItMTZmYWFmY2Y0ZWU0IiwiUm9sZSI6InVzZXIifQ.iv_JT1Fke-QaK2nx2FEF_pkDroyJP-_xK81egOAV7h4
        type: string
      user_id:
        example: 8794e589-0ddb-43ce-9f92-16faafcf4ee4
        type: string
      username:
        example: username
        type: string
    type: object
  internal_features_auth_transport_http.RegisterDTO:
    properties:
      email:
        example: m4rkek@gmail.com
        type: string
        x-order: "0"
      password:
        example: supersecretpass
        maxLength: 64
        minLength: 8
        type: string
        x-order: "2"
      role:
        example: admin
        type: string
        x-order: "3"
      username:
        example: m4rkek
        type: string
        x-order: "1"
    required:
    - email
    - password
    - role
    type: object
  internal_features_auth_transport_http.RegisterDTOResponse:
    properties:
      createdAt:
        example: "2026-03-25T12:00:41.267Z"
        type: string
        x-order: "4"
      email:
        example: m4rkek@gmail.com
        type: string
        x-order: "2"
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
        x-order: "0"
      role:
        example: user
        type: string
        x-order: "3"
      username:
        example: m4rkek
        type: string
        x-order: "1"
    type: object
  internal_features_post_transport_http.CreatePostDTO:
    properties:
      content:
        example: Hello, world!
        maxLength: 280
        minLength: 1
        type: string
      image_url:
        example: https://example.com/image.jpg
        type: string
      parent_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
    required:
    - content
    type: object
  internal_features_post_transport_http.PostDTOResponse:
    properties:
      content:
        example: Hello, world!
        type: string
      created_at:
        example: "2026-03-25T12:00:41.267Z"
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      image_url:
        example: https://example.com/image.jpg
        type: string
      likes_count:
        example: 10
        type: integer
      parent_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      user_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
    type: object
  internal_features_post_transport_http.PostWithAuthorDTOResponse:
    properties:
      avatar_url:
        example: https://example.com/avatar.jpg
        type: string
      content:
        example: Hello, world!
        type: string
      created_at:
        example: "2026-03-25T12:00:41.267Z"
        type: string
      deleted_at:
        example: "2026-03-25T12:00:41.267Z"
        type: string
      display_name:
        example: test
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      image_url:
        example: https://example.com/image.jpg
        type: string
      likes_count:
        example: 10
        type: integer
      parent_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      user_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      username:
        example: testuser
        type: string
    type: object
  internal_features_post_transport_http.PostsWithPaginationDTOResponse:
    properties:
      pagination:
        $ref: '#/definitions/internal_features_post_transport_http.paginationDTO'
      posts:
        items:
          $ref: '#/definitions/internal_features_post_transport_http.PostWithAuthorDTOResponse'
        type: array
    type: object
  internal_features_post_transport_http.paginationDTO:
    properties:
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 20
        type: integer
      total_pages:
        example: 100
        type: integer
    type: object
  internal_features_profile_transport_http.ProfileResponse:
    properties:
      avatar_url:
        example: http://localhost:8080/avatar_url
        type: string
      created_at:
        example: 2006-01-02T15:04:05Z07:00
        type: string
      display_name:
        example: mark
        type: string
      email:
        example: test.user@email.com
        type: string
      email_verified:
        example: false
        type: boolean
      id:
        example: 8794e589-0ddb-43ce-9f92-16faafcf4ee4
        type: string
      role:
        example: user
        type: string
      status:
        example: something smart
        type: string
      username:
        example: username
        type: string
    type: object
  internal_features_profile_transport_http.UpdateProfileRequest:
    properties:
      display_name:
        example: mark
        type: string
      status:
        example: something smart
        type: string
      username:
        example: username
        type: string
    type: object
host: 127.0.0.1:8080
info:
  contact: {}
  title: actualiteco/actualite
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: Авторизует пользователя по email и паролю, возвращает JWT
      parameters:
      - description: тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_auth_transport_http.LoginDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Успешная авторизация
          schema:
            $ref: '#/definitions/internal_features_auth_transport_http.LoginDTOResponse'
        "400":
          description: Невалидный запрос
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "401":
          description: Неверные учётные данные
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.InternalError'
      summary: Авторизация по email и паролю
      tags:
      - Auth
  /posts/{postID}:
    get:
      consumes:
      - application/json
      description: Ищет пост по ID и возвращает информацию о посте + краткую информацию
        об авторе (username, display_name, avatar_url)
      parameters:
      - description: Post ID (UUID)
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        format: uuid
        in: path
        name: postID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Пост найден
          schema:
            $ref: '#/definitions/internal_features_post_transport_http.PostWithAuthorDTOResponse'
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "401":
          description: Не удалось аутентифицировать пользователя
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "404":
          description: Пост не найден
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.InternalError'
      security:
      - BearerAuth: []
      summary: Поиск поста по ID
      tags:
      - Posts
  /posts/{postID}/replies:
    get:
      consumes:
      - application/json
      description: Ищет комментарии на пост по его ID с поддержкой пагинации через
        параметры page и page_size
      parameters:
      - description: Post ID (UUID)
        example: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
        format: uuid
        in: path
        name: postID
        required: true
        type: string
      - default: 1
        description: Номер страницы
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Размер страницы
        in: query
        maximum: 30
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Посты найдены
          schema:
            $ref: '#/definitions/internal_features_post_transport_http.PostsWithPaginationDTOResponse'
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "401":
          description: Неверные учетные данные
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "404":
          description: У поста нет комментариев
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.InternalError'
      security:
      - BearerAuth: []
      summary: Поиск комментариев на пост
      tags:
      - Posts
  /posts/create:
    post:
      consumes:
      - application/json
      description: Создает пост длиной <= 280 символов
      parameters:
      - description: parent_id, image_url - необязательные параметры
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_post_transport_http.CreatePostDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Пост создан
          schema:
            $ref: '#/definitions/internal_features_post_transport_http.PostDTOResponse'
        "400":
          description: Неверный запрос (content > 280 символов; userID неправильного
            формата)
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "401":
          description: Неверные учетные данные
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "404":
          description: Не удалось найти пост с данным parent_id
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.InternalError'
      security:
      - BearerAuth: []
      summary: Создание поста
      tags:
      - Posts
  /profile:
    patch:
      consumes:
      - application/json
      description: Обновить профиль пользователя (display_name, username, status)
      parameters:
      - description: Информация профиля
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_profile_transport_http.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешный запрос
          schema:
            $ref: '#/definitions/internal_features_profile_transport_http.ProfileResponse'
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "403":
          description: Пользователь неавторизован
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "409":
          description: Пользователь с таким юзернеймом уже существует
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.InternalError'
      security:
      - BearerAuth: []
      summary: Обновить профиль пользователя
      tags:
      - Profile
  /profile/{userID}:
    get:
      consumes:
      - application/json
      description: Получить профиль пользователя с постами по id пользователя
      parameters:
      - description: User ID
        in: path
        name: userID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_profile_transport_http.ProfileResponse'
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "403":
          description: Пользователь неавторизован
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.InternalError'
      security:
      - BearerAuth: []
      summary: Получить профиль пользователя
      tags:
      - Profile
  /profile/{userID}/posts:
    get:
      consumes:
      - application/json
      description: Ищет посты пользователя по ID с поддержкой пагинации через параметры
        page и page_size
      parameters:
      - description: User ID (UUID)
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        format: uuid
        in: path
        name: userID
        required: true
        type: string
      - default: 1
        description: Номер страницы
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Размер страницы
        in: query
        maximum: 30
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Посты найдены
          schema:
            $ref: '#/definitions/internal_features_post_transport_http.PostsWithPaginationDTOResponse'
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "401":
          description: Неверные учетные данные
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "404":
          description: У пользователя нет постов
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.InternalError'
      security:
      - BearerAuth: []
      summary: Поиск постов пользователя
      tags:
      - Posts
  /profile/me:
    get:
      consumes:
      - application/json
      description: Получить профиль пользователя с постами по JWT
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_features_profile_transport_http.ProfileResponse'
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "403":
          description: Пользователь неавторизован
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.InternalError'
      security:
      - BearerAuth: []
      summary: Получить профиль пользователя по JWT
      tags:
      - Profile
  /register:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя и возвращает его данные
      parameters:
      - description: тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_auth_transport_http.RegisterDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Пользователь создан
          schema:
            $ref: '#/definitions/internal_features_auth_transport_http.RegisterDTOResponse'
        "400":
          description: Неверный запрос или email уже занят
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.InternalError'
      summary: Регистрация пользователя
      tags:
      - Auth
securityDefinitions:
  BearerAuth:
    description: Введите "Bearer" и JWT-токен через пробел.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
