definitions:
  actualiteco_actualite_internal_core_domain.CustomError:
    properties:
      code:
        type: string
      message:
        example: invalid request
        type: string
    type: object
  actualiteco_actualite_internal_core_domain.InternalError:
    properties:
      code:
        enum:
        - INTERNAL_ERROR
        type: string
      message:
        type: string
    type: object
  internal_features_auth_transport_http.LoginDTO:
    properties:
      email:
        example: test.user@email.com
        type: string
      password:
        example: hashpassword
        maxLength: 64
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  internal_features_auth_transport_http.RefreshDTO:
    properties:
      refresh_token:
        example: old_refresh_token
        type: string
    required:
    - refresh_token
    type: object
  internal_features_auth_transport_http.RegisterDTO:
    properties:
      email:
        example: m4rkek@gmail.com
        type: string
        x-order: "0"
      password:
        example: supersecretpass
        maxLength: 64
        minLength: 8
        type: string
        x-order: "2"
      role:
        example: admin
        type: string
        x-order: "3"
      username:
        example: m4rkek
        type: string
        x-order: "1"
    required:
    - email
    - password
    - role
    type: object
  internal_features_auth_transport_http.RegisterDTOResponse:
    properties:
      createdAt:
        example: "2026-03-25T12:00:41.267Z"
        type: string
        x-order: "4"
      email:
        example: m4rkek@gmail.com
        type: string
        x-order: "2"
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
        x-order: "0"
      role:
        example: user
        type: string
        x-order: "3"
      username:
        example: m4rkek
        type: string
        x-order: "1"
    type: object
  internal_features_auth_transport_http.TokensDTOResponse:
    properties:
      access_token:
        example: new_access_token
        type: string
      expires_in:
        example: 600
        type: integer
      refresh_token:
        example: new_refresh_token
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  internal_features_post_transport_http.CreatePostDTO:
    properties:
      content:
        example: Hello, world!
        maxLength: 280
        minLength: 1
        type: string
      image_url:
        example: https://example.com/image.jpg
        type: string
      parent_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
    required:
    - content
    type: object
  internal_features_post_transport_http.LikeResponse:
    properties:
      message:
        type: string
    type: object
  internal_features_post_transport_http.PostDTOResponse:
    properties:
      content:
        example: Hello, world!
        type: string
      created_at:
        example: "2026-03-25T12:00:41.267Z"
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      image_url:
        example: https://example.com/image.jpg
        type: string
      likes_count:
        example: 10
        type: integer
      parent_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      user_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
    type: object
  internal_features_post_transport_http.PostWithAuthorDTOResponse:
    properties:
      avatar_url:
        example: https://example.com/avatar.jpg
        type: string
      content:
        example: Hello, world!
        type: string
      created_at:
        example: "2026-03-25T12:00:41.267Z"
        type: string
      deleted_at:
        example: "2026-03-25T12:00:41.267Z"
        type: string
      display_name:
        example: test
        type: string
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      image_url:
        example: https://example.com/image.jpg
        type: string
      is_liked:
        example: false
        type: boolean
      likes_count:
        example: 10
        type: integer
      parent_id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      user_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      username:
        example: testuser
        type: string
    type: object
  internal_features_post_transport_http.PostsWithPaginationDTOResponse:
    properties:
      pagination:
        $ref: '#/definitions/internal_features_post_transport_http.paginationDTO'
      posts:
        items:
          $ref: '#/definitions/internal_features_post_transport_http.PostWithAuthorDTOResponse'
        type: array
    type: object
  internal_features_post_transport_http.paginationDTO:
    properties:
      page:
        example: 1
        type: integer
      page_size:
        example: 20
        type: integer
      total:
        example: 20
        type: integer
      total_pages:
        example: 100
        type: integer
    type: object
  internal_features_profile_transport_http.FollowResponse:
    properties:
      message:
        example: success
        type: string
    type: object
  internal_features_profile_transport_http.ProfileResponse:
    properties:
      avatar_url:
        example: http://localhost:8080/avatar_url
        type: string
      display_name:
        example: mark
        type: string
      followers_count:
        example: 10
        type: integer
      following_count:
        example: 5
        type: integer
      id:
        example: 8794e589-0ddb-43ce-9f92-16faafcf4ee4
        type: string
      is_following:
        example: true
        type: boolean
      role:
        example: user
        type: string
      status:
        example: something smart
        type: string
      username:
        example: username
        type: string
    type: object
  internal_features_profile_transport_http.UpdateProfileRequest:
    properties:
      display_name:
        example: mark
        type: string
      status:
        example: something smart
        type: string
      username:
        example: username
        type: string
    type: object
  internal_features_profile_transport_http.UploadAvatarResponse:
    properties:
      avatar_url:
        example: http://localhost:8333/3,01637037d6
        type: string
    type: object
host: 127.0.0.1:8080
info:
  contact: {}
  title: actualiteco/actualite
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Авторизует пользователя по email и паролю, возвращает access и
        refresh токены с временем жизни access token в секундах (10 минут)
      parameters:
      - description: Тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_auth_transport_http.LoginDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Успешная авторизация
          schema:
            $ref: '#/definitions/internal_features_auth_transport_http.TokensDTOResponse'
        "400":
          description: Невалидный запрос
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "401":
          description: Неверные учётные данные
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.InternalError'
      summary: Авторизация по email и паролю
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Инвалидирует refresh-токен. Пока привязанный к нему access-токен
        не протух, по нему еще можно будет делать запросы (будет исправлено позже
        после интеграции Redis), но при это обновлять refresh-токен уже нельзя. Операция
        идемпотентна, можно несколько раз отозвать один и тот же refresh-токен без
        ошибки
      produces:
      - application/json
      responses:
        "204":
          description: Сессия успешно инвалидирована
        "401":
          description: Access-токен протух или не валиден
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.InternalError'
      security:
      - BearerAuth: []
      summary: Инвалидация refresh-токена
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Обновляет refresh-токен, возвращает access и refresh токены с временем
        жизни access token в секундах (10 минут). Используется, когда прежний AccessToken
        протух
      parameters:
      - description: Тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_auth_transport_http.RefreshDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Успешное обновление токена
          schema:
            $ref: '#/definitions/internal_features_auth_transport_http.TokensDTOResponse'
        "400":
          description: Невалидный запрос
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "401":
          description: Refresh-токен протух или не валиден
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "404":
          description: Сессия или пользователь-обладатель сессии не найден
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.InternalError'
      summary: Обновление refresh-токена
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя и возвращает его данные
      parameters:
      - description: тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_auth_transport_http.RegisterDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Пользователь создан
          schema:
            $ref: '#/definitions/internal_features_auth_transport_http.RegisterDTOResponse'
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "409":
          description: Email или username уже заняты
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.InternalError'
      summary: Регистрация пользователя
      tags:
      - Auth
  /posts:
    get:
      consumes:
      - application/json
      description: Возвращаются посты подписок пользователя и посты за последний месяц
        (отсортированные по количеству лайков) поддержкой пагинации через параметры
        page и page_size
      parameters:
      - default: 1
        description: Номер страницы
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Размер страницы
        in: query
        maximum: 30
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Посты возвращены
          schema:
            $ref: '#/definitions/internal_features_post_transport_http.PostsWithPaginationDTOResponse'
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "401":
          description: Неверные учетные данные
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.InternalError'
      security:
      - BearerAuth: []
      summary: Возвращает посты для ленты
      tags:
      - Posts
  /posts/{postID}:
    delete:
      consumes:
      - application/json
      description: Удаляет пост, если запрос на удаление исходит от автора поста.
        Метод идемпотентен
      parameters:
      - description: Post ID (UUID)
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        format: uuid
        in: path
        name: postID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Пост успешно удален
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "401":
          description: Неверные учетные данные
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "404":
          description: Пост не найден
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "409":
          description: Пост принадлежит не текущему пользователю
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.InternalError'
      security:
      - BearerAuth: []
      summary: Удаление поста
      tags:
      - Posts
    get:
      consumes:
      - application/json
      description: Ищет пост по ID и возвращает информацию о посте + краткую информацию
        об авторе (username, display_name, avatar_url)
      parameters:
      - description: Post ID (UUID)
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        format: uuid
        in: path
        name: postID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Пост найден
          schema:
            $ref: '#/definitions/internal_features_post_transport_http.PostWithAuthorDTOResponse'
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "401":
          description: Не удалось аутентифицировать пользователя
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "404":
          description: Пост не найден
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.InternalError'
      security:
      - BearerAuth: []
      summary: Поиск поста по ID
      tags:
      - Posts
  /posts/{postID}/like:
    post:
      consumes:
      - application/json
      description: Поставить лайк на пост авторизованному пользователю
      parameters:
      - description: Post ID
        in: path
        name: postID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Лайк успешно поставлен
          schema:
            $ref: '#/definitions/internal_features_post_transport_http.LikeResponse'
        "400":
          description: Невалидный post ID или состояние лайка
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "404":
          description: Пост не найден
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.InternalError'
      security:
      - BearerAuth: []
      summary: Поставить лайк
      tags:
      - Posts
  /posts/{postID}/replies:
    get:
      consumes:
      - application/json
      description: Ищет комментарии на пост по его ID с поддержкой пагинации через
        параметры page и page_size
      parameters:
      - description: Post ID (UUID)
        example: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
        format: uuid
        in: path
        name: postID
        required: true
        type: string
      - default: 1
        description: Номер страницы
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Размер страницы
        in: query
        maximum: 30
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Все комментарии возвращены (если под постом нет комментариев
            - будет пустой массив)
          schema:
            $ref: '#/definitions/internal_features_post_transport_http.PostsWithPaginationDTOResponse'
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "401":
          description: Неверные учетные данные
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "404":
          description: Пост не был найден
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.InternalError'
      security:
      - BearerAuth: []
      summary: Поиск комментариев на пост
      tags:
      - Posts
  /posts/{postID}/unlike:
    post:
      consumes:
      - application/json
      description: Убрать лайк с поста авторизованному пользователю
      parameters:
      - description: Post ID
        in: path
        name: postID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Лайк успешно снят
          schema:
            $ref: '#/definitions/internal_features_post_transport_http.LikeResponse'
        "400":
          description: Невалидный post ID или состояние лайка
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "404":
          description: Пост не найден
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.InternalError'
      security:
      - BearerAuth: []
      summary: Убрать лайк
      tags:
      - Posts
  /posts/create:
    post:
      consumes:
      - application/json
      description: Создает пост длиной <= 280 символов
      parameters:
      - description: parent_id, image_url - необязательные параметры
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_post_transport_http.CreatePostDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Пост создан
          schema:
            $ref: '#/definitions/internal_features_post_transport_http.PostDTOResponse'
        "400":
          description: Неверный запрос (content > 280 символов; userID неправильного
            формата)
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "401":
          description: Неверные учетные данные
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "404":
          description: Не удалось найти пост с данным parent_id
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.InternalError'
      security:
      - BearerAuth: []
      summary: Создание поста
      tags:
      - Posts
  /posts/me:
    get:
      consumes:
      - application/json
      description: Ищет посты пользователя по его Access Token с поддержкой пагинации
        через параметры page и page_size
      parameters:
      - default: 1
        description: Номер страницы
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Размер страницы
        in: query
        maximum: 30
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Все существующие посты возвращены (если у пользователя нет
            постов - будет пустой массив)
          schema:
            $ref: '#/definitions/internal_features_post_transport_http.PostsWithPaginationDTOResponse'
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "401":
          description: Неверные учетные данные
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.InternalError'
      security:
      - BearerAuth: []
      summary: Поиск постов пользователя по его JWT
      tags:
      - Posts
  /profile:
    patch:
      consumes:
      - application/json
      description: Обновить профиль пользователя (display_name, username, status)
      parameters:
      - description: Информация профиля
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_profile_transport_http.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешный запрос
          schema:
            $ref: '#/definitions/internal_features_profile_transport_http.ProfileResponse'
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/actualiteco_actualite_internal_core_domain.CustomError'
        "403":
          description: Пользователь неавторизован
          schema:
