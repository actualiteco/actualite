services:
  actualite:
    container_name: actualite-app
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./out/logs:/out/logs
      - ./docs:/docs
    depends_on:
      db-postgres:
        condition: service_healthy

  db-postgres:
    image: postgres:18.1-bookworm
    container_name: postgres-database
    environment:
     - POSTGRES_USER=${POSTGRES_USER}
     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
     - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./db/postgres/data:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  db-migrations:
    image: migrate/migrate:v4.19.1
    container_name: postgres-migrations
    volumes:
      - ./migrations:/migrations
    depends_on:
      db-postgres:
        condition: service_healthy

  swagger:
    build: 
      context: ${PROJECT_ROOT}
      dockerfile: docs/Dockerfile
    volumes:
      - ${PROJECT_ROOT}:/code
